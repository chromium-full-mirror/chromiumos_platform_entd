<html>
  <head>
    <script src="client.js"></script>
    <style>
      body {
        color: #3f444a;
        font-size: 15px;
        font-family: sans-serif;
        padding: 0px;
        margin: 0px;
      }

      #page {
        position: absolute;
        top: 0px;
        bottom: 0px;

        background: -webkit-gradient(linear, left top, left bottom,
                     from(#d5e5f9), to(#b6c4d5));
        height: 100%;
        width: 100%;
      }

      h1 {
        color: #fff;
        text-shadow: #16181a 0px 0px 5px;
      }

      #content {
        margin-right: auto;
        margin-left: auto;
        width: 600px;
        padding-left: 3em;
        padding-right: 3em;
        padding-top: 1em;
        padding-bottom: 1em;
        background-color: #a1adbc;
        border-radius: 8px;
        -webkit-box-shadow: 2px 2px 2px #16181a;

        background: -webkit-gradient(linear, left top, left bottom,
                     from(#a1adbc), to(#adbaca));
      }

      #cert-list {
        padding: 0px;
      }

      #cert-list li {
        background: -webkit-gradient(linear, left top, left bottom,
                     from(#f5f5f5), to(#fff));
        border-radius: 4px;
        padding: 0.5em;
        list-style-type: none;
        -webkit-box-shadow: 1px 1px 1px #16181a;
        margin-bottom: 1em;
      }

      #cert-list li .label {
        font-weight: bold;
      }

      #cert-list li[data-installed="0"] .status {
        color: red;
      }

      #cert-list li[data-installed="1"] .status {
        color: green;
      }

      #modal-shade {
        background-color: rgba(0,0,0,0.35);
        position: absolute;
        width: 100%;
        height: 100%;
        top: -100%;
        display: none;
        -webkit-transition: top 0.25s ease-in-out;
      }

      #modal-dialog {
        position: relative;
        background: -webkit-gradient(linear, left top, left bottom,
                     from(#ddd), to(#fff));
        border-radius: 4px;
        border: 5px orange solid;
        padding: 0.5em;
        list-style-type: none;
        -webkit-box-shadow: 2px 2px 2px #16181a;
        width: 50%;
        margin: auto;
        margin-top: 20%;
      }

      input.invalid {
        background-color: red;
        color: white;
      }
    </style>
  </head>
  <body onload="client.onLoad()">
    <div id="page">
      <div id="modal-shade">
        <div id="modal-dialog">
          <b>Required Input</b>
          <hr>
          The certificate &ldquo;<span id="modal-desc"></span>&rdquo;
          requires user input to complete the installation.
          <form onsubmit="client.onModalSubmit_(); return false">
            <ul id="user-vars"></ul>
            <div style="height:2em">
              <div style="float:right">
                <input type="submit" value="Submit">
                <button onclick="client.onModalCancel_()">Cancel</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <center>
        <h1>Enterprise policy options</h1>
        <h2 id="title"><!-- client.js will replace this title --></h2>
      </center>

      <div id="content">
        <h2>Certificate Status</h2>
        <ul id="cert-list">
          <!-- client.js will populate this with the known certs -->
          <li><center>Waiting for reply from the Enterprise
              Daemon...</center></li>
        </ul>
      </div>
    </div>
  </body>
</html>
